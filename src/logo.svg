<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" role="img" aria-label="AGENT/OS — Academia de Agentes de IA">
  <!-- AGENT/OS · lockup horizontal para fondo oscuro · ED-Dev -->
  <defs>
    <linearGradient id="cueva" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2018"/>
      <stop offset="1" stop-color="#04120c"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7bffb9"/>
      <stop offset="1" stop-color="#4fe3a5"/>
    </linearGradient>
    <linearGradient id="ambar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd88f"/>
      <stop offset="1" stop-color="#ffc46b"/>
    </linearGradient>
  </defs>
  <!-- insignia -->
  <g>
    <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#cueva)" stroke="rgba(79,227,165,.35)" stroke-width="1.5"/>
    <path d="M20 20 L27 28 L20 36" fill="none" stroke="url(#mint)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="32" y="35.5" width="13" height="5.5" rx="2.75" fill="url(#ambar)"/>
  </g>
  <!-- marca -->
  <text x="78" y="41" font-family="'Unbounded','Space Grotesk',system-ui,sans-serif" font-weight="800" font-size="21" letter-spacing="-0.5" fill="#eafff5">AGENT<tspan fill="#4fe3a5">//</tspan>OS</text>
  <text x="79" y="55" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="8" letter-spacing="3.4" fill="rgba(234,255,245,.55)">ACADEMIA DE AGENTES DE IA</text>
</svg>
