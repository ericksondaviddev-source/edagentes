<!-- hyperframes-registry-item: logo-outro (customized for AGENT//OS) -->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Logo Outro — AGENT//OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=JetBrains+Mono:wght@400;600;700&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div
      id="logo-outro"
      data-composition-id="logo-outro"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="6"
    >
      <div class="canvas">
        <div class="logo-glow" id="logo-glow"></div>

        <div class="stage">
          <div class="wordmark" id="wordmark" data-layout-allow-overflow="true">
            <span class="logo-piece pw">A</span><span class="logo-piece pw">G</span><span class="logo-piece pw">E</span><span class="logo-piece pw">N</span><span class="logo-piece pw">T</span><span class="logo-piece pa">/</span><span class="logo-piece pa">/</span><span class="logo-piece pw">O</span><span class="logo-piece pw">S</span>
          </div>
          <div class="rule" id="rule"></div>
          <div class="tagline" id="tagline">
            <span class="tw">APRENDE</span>
            <span class="tw">A</span>
            <span class="tw">DIRIGIR</span>
            <span class="tw">AGENTES</span>
            <span class="tw">DE</span>
            <span class="tw">IA</span>
            <span class="tw">COMO</span>
            <span class="tw">UN</span>
            <span class="tw">PRO</span>
          </div>
          <div class="url-pill" id="url-pill">
            <span class="url-text">ACADEMIA INTERACTIVA · PI · OPENCODE · LLMs LOCALES</span>
          </div>
        </div>
      </div>

      <style>
        #logo-outro .canvas {
          width: 1920px;
          height: 1080px;
          background: transparent;
          position: relative;
          overflow: hidden;
        }
        #logo-outro .stage {
          position: relative;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 34px;
          z-index: 2;
        }
        #logo-outro .wordmark {
          display: flex;
          align-items: baseline;
          font-family: "Unbounded", sans-serif;
          font-weight: 800;
          font-size: 176px;
          line-height: 1.1;
          letter-spacing: 2px;
        }
        #logo-outro .logo-piece {
          display: inline-block;
          opacity: 0;
        }
        #logo-outro .pw {
          color: #e9f2ee;
          text-shadow: 0 0 60px rgba(79, 227, 165, 0.28);
        }
        #logo-outro .pa {
          color: #4fe3a5;
          text-shadow: 0 0 46px rgba(79, 227, 165, 0.45);
        }
        #logo-outro .logo-glow {
          position: absolute;
          left: 610px;
          top: 260px;
          width: 700px;
          height: 480px;
          background: radial-gradient(ellipse, rgba(79, 227, 165, 0.22) 0%, rgba(6, 9, 12, 0) 68%);
          border-radius: 50%;
          opacity: 0;
          pointer-events: none;
          z-index: 1;
        }
        #logo-outro .rule {
          width: 340px;
          height: 3px;
          border-radius: 3px;
          background: linear-gradient(90deg, rgba(79, 227, 165, 0), #4fe3a5, rgba(79, 227, 165, 0));
          transform: scaleX(0);
          opacity: 0.85;
          margin-top: -6px;
        }
        #logo-outro .tagline {
          display: flex;
          gap: 18px;
          font-family: "Unbounded", sans-serif;
          font-weight: 500;
          font-size: 29px;
          letter-spacing: 3px;
          color: #c6d4ce;
        }
        #logo-outro .tw {
          display: inline-block;
          opacity: 0;
        }
        #logo-outro .url-pill {
          background: rgba(79, 227, 165, 0.07);
          border: 1px solid rgba(79, 227, 165, 0.32);
          border-radius: 100px;
          padding: 12px 30px;
          opacity: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #logo-outro .url-text {
          font-family: "JetBrains Mono", monospace;
          font-size: 20px;
          font-weight: 600;
          color: #9fe8c9;
          letter-spacing: 2px;
        }
      </style>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          const pieces = '#logo-outro .logo-piece';
          const words = '#logo-outro .tw';
          const logoGlow = '#logo-outro .logo-glow';
          const rule = '#logo-outro .rule';
          const tagline = '#logo-outro .tagline';
          const urlPill = '#logo-outro .url-pill';
          const wordmark = '#logo-outro .wordmark';

          /* 1. wordmark assembles piece by piece (ripple from the right) */
          tl.fromTo(
            pieces,
            { x: 1920, opacity: 0 },
            { x: 0, opacity: 1, duration: 1.1, ease: "power4.out", stagger: 0.07 },
            0.1
          );

          /* 2. settle punch (after all slides finish, no transform overlap) */
          tl.to(pieces, { scale: 1.05, duration: 0.28, ease: "back.out(1.7)", yoyo: true, repeat: 1, stagger: 0.02, transformOrigin: "50% 50%" }, 1.9);

          /* 3. glow bloom, settles to a living halo */
          tl.fromTo(logoGlow, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1.12, duration: 0.38, ease: "power2.out" }, 1.85);
          tl.to(logoGlow, { opacity: 0.42, scale: 1.3, duration: 1.1, ease: "power2.out" }, 2.25);
          tl.to('#logo-outro .pa', { textShadow: "0 0 64px rgba(79,227,165,.85)", duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.9);

          /* 4. accent rule sweeps open, anchoring wordmark to tagline */
          tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut", transformOrigin: "50% 50%" }, 2.15);

          /* 5. tagline word-reveal */
          tl.fromTo(words, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.07 }, 2.3);

          /* 6. glass pill */
          tl.fromTo(urlPill, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 2.85);

          /* 7. hold with a breathing pulse (seekable, finite) */
          tl.to(wordmark, { scale: 1.014, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut", transformOrigin: "50% 50%" }, 4.7);

          window.__timelines = window.__timelines || {};
          window.__timelines["logo-outro"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
